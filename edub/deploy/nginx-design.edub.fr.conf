# /etc/nginx/sites-available/design.edub.fr  (source de vérité : edub/deploy/ du dépôt edub-design)
# Edub Design — portail Edub (Next) 127.0.0.1:3038 + éditeur Rust (--online) 127.0.0.1:3100.
# Spec : docs/edub/2026-11-16-edub-design-spec.md §Routage.
#   Public (sans Authelia) : /mcp (Bearer vérifié par le portail), manifeste PWA, sw.js, icônes
#   Authelia (serveur)     : portail, bundle /pkg/ et /canvaskit/ (la page /editor passe par le gate)
#   Gate portail           : /api/* de l'éditeur — le portail revérifie Authelia + les droits sur
#                            le fichier (?tenant=) et nginx injecte un Bearer par fichier
#   Fermé                  : /api/v1/ (contrat hub, loopback), /api/edub/editor-gate (interne)
server {
    server_name design.edub.fr;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/snippets/edub-security-headers.conf;

    client_max_body_size 50m;

    # ─── Public : MCP HTTP (Bearer token vérifié par le portail ; SSE possible) ───
    location /mcp {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Public : installabilité PWA (le navigateur n'envoie pas toujours le cookie) ───
    location = /manifest.webmanifest {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sw.js {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    # Overlay de l'éditeur (ED_1730) : fichier statique du portail, sans donnée perso ni secret.
    location = /edub-shell.js {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
    location ~* ^/(icon-[0-9maskble-]+\.png|apple-touch-icon\.png|favicon\.ico|favicon-[0-9]+\.png)$ {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # ─── Éditeur : page + bundle statique (Authelia serveur ; aucun document servi ici) ───
    # La page est gatée comme l'API : un fichier sans droit répond 404 (jamais « existe mais interdit »).
    # Le gate revérifie la session Authelia lui-même ; 401 → login Authelia.
    location = /editor {
        auth_request /internal/edub-editor-gate;
        auth_request_set $edub_gate_reason $upstream_http_x_edub_gate_reason;
        error_page 401 =302 https://auth.edub.fr/?rd=$scheme://$http_host$request_uri;
        error_page 403 = @edub_editor_403;
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        # ED_1730 : marque Edub Design + overlay injectés dans la page de l'hôte (aucun patch Rust).
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<html lang="en">' '<html lang="fr">';
        sub_filter '<title>OpenPencil</title>' '<title>Edub Design</title><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b0b0f"><meta name="application-name" content="Edub Design"><script src="/edub-shell.js"></script>';
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/edub-security-headers.conf;
        # Confidentialité : le navigateur ne parle qu'à design.edub.fr (aucune image, police, icône ou
        # mise à jour tierce). S'ajoute au CSP du snippet ; le navigateur applique l'intersection.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    location = /editor/ { return 301 /editor$is_args$args; }
    location ^~ /pkg/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
    }
    location ^~ /canvaskit/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
    }

    # ─── Portail : santé + API Edub (Authelia serveur) ───
    location = /api/health {
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
    }
    location ^~ /api/edub/editor-gate { return 404; }
    location ^~ /api/edub/ {
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
    }
    # Contrat « hub » (introspection des jetons éditeur) : appelé par l'éditeur en loopback seulement.
    location ^~ /api/v1/ { return 404; }

    # ─── Éditeur : API, gatée fichier par fichier par le portail ───
    # Ce auth_request REMPLACE celui d'Authelia (un seul par location) : le gate revérifie
    # lui-même la session Authelia (cookie), le groupe design/admin, puis le droit sur ?tenant=.
    location ^~ /api/ {
        auth_request /internal/edub-editor-gate;
        auth_request_set $edub_editor_token $upstream_http_x_edub_editor_token;
        auth_request_set $edub_gate_reason $upstream_http_x_edub_gate_reason;
        error_page 401 = @edub_editor_401;
        error_page 403 = @edub_editor_403;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer $edub_editor_token";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        # SSE (/api/mcp/events) + streaming IA + gros push de document
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /internal/edub-editor-gate {
        internal;
        proxy_pass http://127.0.0.1:3038/api/edub/editor-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        client_max_body_size 0;
    }
    location @edub_editor_401 {
        default_type application/json;
        return 401 '{"ok":false,"error":"unauthorized","message":"session Authelia absente ou expirée"}';
    }
    # 403 du gate : « pas de droit sur ce fichier » est présenté comme 404 (le fichier ne doit pas
    # sembler exister) ; les autres refus (lecture seule, CSRF, route fermée) restent des 403.
    location @edub_editor_403 {
        default_type application/json;
        if ($edub_gate_reason ~ "^(no-access-to-file|missing-or-invalid-tenant)$") {
            return 404 '{"ok":false,"error":"not_found"}';
        }
        return 403 '{"ok":false,"error":"forbidden","reason":"$edub_gate_reason"}';
    }

    # ─── Reste : derrière Authelia. Le portail lit l'identité dans Remote-* ───
    location / {
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les Remote-* sont posés ICI depuis la réponse Authelia : un client ne peut pas les forger.
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        # SSE + streaming IA
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/edub-security-headers.conf;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/design.edub.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design.edub.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /home/ubuntu/apps/edub-auth/nginx/authelia-server.conf;
}

server {
    if ($host = design.edub.fr) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name design.edub.fr;
    return 404;
}
