# /etc/nginx/sites-available/design.edub.fr  (source de vérité : edub/deploy/ du dépôt edub-design)
# Edub Design — portail Edub (Node) sur 127.0.0.1:3038 (PM2 edub-design-portal, user edub).
# L'éditeur Rust (3100, loopback) n'est JAMAIS exposé ici : seul le portail le joint.
#   Public (sans Authelia) : /mcp (Bearer vérifié par le portail), manifeste PWA, sw.js, icônes
#   Derrière Authelia      : tout le reste (auth_request au niveau serveur, groupe design/admin)
server {
    server_name design.edub.fr;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/snippets/edub-security-headers.conf;

    client_max_body_size 50m;

    # ─── Public : MCP HTTP (Bearer token vérifié par le portail ; SSE possible) ───
    location /mcp {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Public : installabilité PWA (le navigateur n'envoie pas toujours le cookie) ───
    location = /manifest.webmanifest {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sw.js {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location ~* ^/(icon-[0-9maskbl-]+\.png|apple-touch-icon\.png|favicon\.ico|favicon-[0-9]+\.png)$ {
        auth_request off;
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # ─── Reste : derrière Authelia. Le portail lit l'identité dans Remote-* ───
    location / {
        proxy_pass http://127.0.0.1:3038;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les Remote-* sont posés ICI depuis la réponse Authelia : un client ne peut pas les forger.
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        # SSE + streaming IA
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/edub-security-headers.conf;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/design.edub.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design.edub.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /home/ubuntu/apps/edub-auth/nginx/authelia-server.conf;
}

server {
    if ($host = design.edub.fr) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name design.edub.fr;
    return 404;
}
